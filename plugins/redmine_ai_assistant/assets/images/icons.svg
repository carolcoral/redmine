    <path d="M17 14.5c0 0-1.5 2.5-5 2.5s-5-2.5-5-2.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M8 17c1.5 1.8 3.5 2 5 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M16 7c-1.5-1.8-3.5-2-5 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  </symbol>
</svg>
