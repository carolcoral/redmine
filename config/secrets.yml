# Rails 8 已不再读取 config/secrets.yml，实际生效的密钥见
# config/initializers/secret_token.rb（环境变量 SECRET_KEY_BASE 或 config/.secret_key_base）。
#
# 本文件仅作占位保留，不含任何真实密钥。
development:
  secret_key_base: <%= ENV['SECRET_KEY_BASE'] || SecureRandom.hex(64) %>

production:
  secret_key_base: <%= ENV['SECRET_KEY_BASE'] || SecureRandom.hex(64) %>

test:
  secret_key_base: <%= ENV['SECRET_KEY_BASE'] || SecureRandom.hex(64) %>
